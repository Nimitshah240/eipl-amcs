version: '3.8'

services:
  jenkins:
    image: jenkins/jenkins:lts
    container_name: jenkins-server
    privileged: true
    user: root
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_data:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - N:/Jenkins:/mnt/jenkins
      - C:/Program Files (x86)/Inno Setup 6:/mnt/innosetup
      - N:/PharmaOne/JAVA/zulu11:/mnt/zulu11
    restart: unless-stopped

volumes:
  jenkins_data: