version: '3.8'

services:
  jenkins:
    build: .
    container_name: jenkins-server
    privileged: true
    user: root
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_data:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      # Mount the whole Jenkins folder. Inside Docker, this becomes /mnt/jenkins
      - N:/Jenkins:/mnt/jenkins
    restart: unless-stopped

volumes:
  jenkins_data: